 ----- Consulta de pagamentos: o totem pergunta a cada 3 s, o backend tamb\u00e9m -----
pagamento.polling.intervalo-ms=3000
 
# ----- Cart\u00e3o (maquininha com o app) -----
# Segundos que o backend espera a maquininha BUSCAR a cobran\u00e7a (app desligado/sem rede)
pagamento.cartao.espera-maquininha-segundos=60
# Segundos at\u00e9 desistir de uma cobran\u00e7a que a maquininha buscou e n\u00e3o respondeu
pagamento.cartao.expiracao-segundos=300
 
# ----- Impressora -----
# Impressora ligada ao TOTEM: o servidor n\u00e3o imprime; o totem busca o cupom em
#   GET /pedido/{id}/cupom/escpos   (ou /cupom, em JSON)
impressora.modo=totem
impressora.loja-id=loja-1
# Em dinheiro o cupom "PAGUE NO CAIXA" \u00e9 gerado na cria\u00e7\u00e3o do pedido.
# true = gera outro cupom (PAGO) quando o caixa confirma o recebimento.
impressora.imprimir-ao-confirmar-dinheiro=false
# (Impressora de rede na mesma rede do servidor: impressora.modo=rede, impressora.host=..., impressora.porta=9100)
 
# ----- PIX com QR Code no totem (API E-commerce da Cielo) -----
# ATEN\u00c7\u00c3O: a integra\u00e7\u00e3o nova de PIX da Cielo N\u00c3O tem sandbox: s\u00f3 funciona em produ\u00e7\u00e3o, com
# dinheiro de verdade, e usa credenciais do E-COMMERCE Cielo (MerchantId/MerchantKey),
# diferentes das credenciais da Cielo Smart.
# Para ATIVAR, tire o # das duas linhas e preencha. N\u00e3o deixe a linha vazia: comente-a.
# Sem elas, o PIX \u00e9 gerado na maquininha (app) como antes.
#cielo.pix.merchant-id=SEU_MERCHANT_ID_ECOMMERCE
#cielo.pix.merchant-key=SUA_MERCHANT_KEY_ECOMMERCE
cielo.pix.expiracao-segundos=60
pagamento.pix.tolerancia-segundos=15
#cielo.pix.cliente-nome=Cliente
#cielo.pix.webhook-token=um-segredo-longo
 
# ----- Estorno (devolu\u00e7\u00e3o de pedido j\u00e1 pago) -----
# Token de GERENTE, com 24 ou mais caracteres. Sem ele o estorno fica DESABILITADO.
# O totem nunca deve conhecer este token. Use vari\u00e1vel de ambiente em produ\u00e7\u00e3o.
#estorno.token=troque-por-um-segredo-longo-de-gerente
# Segundos que o backend espera a maquininha buscar um estorno de cart\u00e3o antes de desistir
estorno.espera-maquininha-segundos=600
 
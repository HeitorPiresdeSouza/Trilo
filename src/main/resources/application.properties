# ----- Consulta de pagamentos: o totem pergunta a cada 3 s, o backend tamb\u00e9m -----
pagamento.polling.intervalo-ms=3000

# ----- PIX com QR Code no totem (API E-commerce da Cielo) -----
# ATEN\u00c7\u00c3O: a integra\u00e7\u00e3o nova de PIX da Cielo N\u00c3O tem sandbox. S\u00f3 funciona em produ\u00e7\u00e3o, com
# dinheiro de verdade, e usa credenciais do E-COMMERCE Cielo (MerchantId/MerchantKey),
# diferentes das credenciais da Cielo Smart.
# Para ATIVAR, tire o # das duas linhas abaixo e preencha. N\u00e3o deixe a linha vazia: comente-a.
# Sem elas, o PIX \u00e9 gerado na maquininha (app) como antes.
#cielo.pix.merchant-id=SEU_MERCHANT_ID_ECOMMERCE
#cielo.pix.merchant-key=SUA_MERCHANT_KEY_ECOMMERCE

# Validade do QR Code (segundos) e toler\u00e2ncia antes de cancelar o pedido (segundos)
cielo.pix.expiracao-segundos=60
pagamento.pix.tolerancia-segundos=15

# Opcional: nome enviado \u00e0 Cielo como "cliente" (o totem n\u00e3o coleta dados do cliente)
#cielo.pix.cliente-nome=Cliente

# Opcional: segredo do webhook. Se definir, cadastre no suporte da Cielo um header de retorno
# X-Webhook-Token com o mesmo valor.
#cielo.pix.webhook-token=um-segredo-longo

# ----- Impressora -----
# Para imprimir pelo servidor (impressora de rede na mesma rede do Spring):
#impressora.modo=rede
#impressora.host=192.168.0.50
#impressora.porta=9100
impressora.loja-id=loja-1
# Em dinheiro o cupom "PAGUE NO CAIXA" sai na cria\u00e7\u00e3o do pedido.
# true = imprime outro cupom (PAGO) quando o caixa confirma o recebimento.
impressora.imprimir-ao-confirmar-dinheiro=false

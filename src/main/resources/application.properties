spring.application.name=fastFurious

# --- Banco: H2 em mem\u00f3ria (os dados somem ao reiniciar) ---
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=

# --- MySQL (desativado por enquanto) ---
#spring.datasource.url=jdbc:mysql://localhost:3306/root?createDatabaseIfNotExist=true&serverTimezone=UTC
#spring.datasource.username=root
#spring.datasource.password=SUA_SENHA

# --- Console do H2 ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- SQL no log ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Cielo (sandbox) ---
cielo.client-id=COLE_AQUI_O_CLIENT_ID
cielo.access-token=COLE_AQUI_O_ACCESS_TOKEN
cielo.merchant-id=COLE_AQUI_O_MERCHANT_ID
cielo.base-url=https://api.cielo.com.br/sandbox-lio/order-management/v1

# --- Consulta de pagamentos (ms entre verifica\u00e7\u00f5es) ---
pagamento.polling.intervalo-ms=5000

# --- Impressora (desativada: o cupom s\u00f3 vai para o log por enquanto) ---
#impressora.modo=rede
#impressora.host=192.168.0.50
#impressora.porta=9100
impressora.loja-id=loja-1